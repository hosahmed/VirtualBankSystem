services:
  mysql:
    image: mysql:8.0
    container_name: spring_boot_mysql
    environment:
      - MYSQL_DATABASE=vbank_users
      - MYSQL_USER=vbank_user
      - MYSQL_PASSWORD=vbank_pass
      - MYSQL_ROOT_PASSWORD=verysecret
    ports:
      - '5555:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:
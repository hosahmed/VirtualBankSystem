version: '3.8'

services:
  vbank-user-db:
    image: mysql:8.0
    container_name: vbank-user-db
    ports:
      - "5555:3306"
    environment:
      MYSQL_DATABASE: vbank_users
      MYSQL_USER: vbank_user
      MYSQL_PASSWORD: vbank_pass
      MYSQL_ROOT_PASSWORD: root_password
    restart: unless-stopped
    volumes:
      - mysql_data:/var/lib/mysql

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://vbank-user-db:3306/vbank_users?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    depends_on:
      - vbank-user-db
    restart: unless-stopped

  bff-service:
    build:
      context: .
      dockerfile: bff-service/Dockerfile
    container_name: bff-service
    ports:
      - "8084:8084"
    environment:
      - USER_SERVICE_URL=http://user-service:8081
      - ACCOUNT_SERVICE_URL=http://account-service:8082
      - TRANSACTION_SERVICE_URL=http://transaction-service:8083
    depends_on:
      - user-service
    restart: unless-stopped

volumes:
  mysql_data:
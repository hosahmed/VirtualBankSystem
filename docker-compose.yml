version: '3.8'

services:
  vbank-user-db:
    image: mysql:8.0
    container_name: vbank-user-db
    ports:
      - "5555:3306"
    environment:
      MYSQL_DATABASE: vbank_users
      MYSQL_USER: vbank_user
      MYSQL_PASSWORD: vbank_pass
      MYSQL_ROOT_PASSWORD: root_password
    restart: unless-stopped
    volumes:
      - mysql_data:/var/lib/mysql

  vbank-account-db:
    image: mysql:8.0
    container_name: vbank-account-db
    ports:
      - "5556:3306"
    environment:
      MYSQL_DATABASE: vbank_accounts
      MYSQL_USER: vbank_user
      MYSQL_PASSWORD: vbank_pass
      MYSQL_ROOT_PASSWORD: root_password
    restart: unless-stopped
    volumes:
      - mysql_account_data:/var/lib/mysql

  vbank-transaction-db:
    image: mysql:8.0
    container_name: vbank-transaction-db
    ports:
      - "5557:3306"
    environment:
      MYSQL_DATABASE: vbank_transactions
      MYSQL_USER: vbank_user
      MYSQL_PASSWORD: vbank_pass
      MYSQL_ROOT_PASSWORD: root_password
    restart: unless-stopped
    volumes:
      - mysql_transaction_data:/var/lib/mysql

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://vbank-user-db:3306/vbank_users?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - vbank-user-db
      - kafka
    restart: unless-stopped

  account-service:
    build:
      context: .
      dockerfile: account-service/Dockerfile
    container_name: account-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://vbank-account-db:3306/vbank_accounts?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - vbank-account-db
      - kafka
    restart: unless-stopped

  transaction-service:
    build:
      context: .
      dockerfile: transaction-service/Dockerfile
    container_name: transaction-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://vbank-transaction-db:3306/vbank_transactions?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - ACCOUNT_SERVICE_URL=http://account-service:8082
    depends_on:
      - vbank-transaction-db
      - kafka
      - account-service
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    restart: unless-stopped

  bff-service:
    build:
      context: .
      dockerfile: bff-service/Dockerfile
    container_name: bff-service
    ports:
      - "8084:8084"
    environment:
      - USER_SERVICE_URL=http://user-service:8081
      - ACCOUNT_SERVICE_URL=http://account-service:8082
      - TRANSACTION_SERVICE_URL=http://transaction-service:8083
    depends_on:
      - user-service
    restart: unless-stopped

volumes:
  mysql_data:
  mysql_account_data:
  mysql_transaction_data: